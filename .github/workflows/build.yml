name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.ZAMPL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ZAMPL_KEYSTORE_BASE64 시크릿이 없습니다. README 의 '서명 키' 항목을 참고해 등록하세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zampl-release.jks"
          echo "ZAMPL_KEYSTORE_PATH=$RUNNER_TEMP/zampl-release.jks" >> "$GITHUB_ENV"

      - name: APK 빌드
        env:
          ZAMPL_KEYSTORE_PASSWORD: ${{ secrets.ZAMPL_KEYSTORE_PASSWORD }}
          ZAMPL_KEY_ALIAS: ${{ secrets.ZAMPL_KEY_ALIAS }}
          ZAMPL_KEY_PASSWORD: ${{ secrets.ZAMPL_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: zampl-apk
          path: app/build/outputs/apk/release/app-release.apk
